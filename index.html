<title>ENT + Audiology — Oral Exam Hub</title>

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --bg:#fff8ec;
    --panel:#ffffff;
    --panel2:#fff1d9;
    --ink:#4a2f11;
    --ink-dim:#8a6a45;
    --accent:#f2932e;
    --accent2:#e2632c;
    --gold:#c76a10;
    --line:#f0d9ae;
    --hi:#c0480e;
    --good:#4f8a5b;
    --bad:#c0453a;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;background:var(--bg);color:var(--ink);}
  #app{display:flex;min-height:100vh;}
  #sidebar{width:330px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:20px 0;overflow-y:auto;height:100vh;position:sticky;top:0;}
  #sidebar h1{font-size:15px;letter-spacing:0.06em;text-transform:uppercase;color:var(--gold);padding:0 20px 14px;margin:0;border-bottom:1px solid var(--line);}
  .region{margin-top:6px;}
  .region-head{padding:12px 20px 6px;font-size:13px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-dim);cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
  .region-head:hover{color:var(--gold);}
  .region-status{font-size:10px;color:var(--ink-dim);opacity:0.6;}
  .topic-list{max-height:1000px;overflow:hidden;transition:max-height .25s ease;}
  .topic-list.collapsed{max-height:0;}
  .topic-item{padding:8px 20px 8px 32px;font-size:13.5px;cursor:pointer;color:var(--ink-dim);border-left:3px solid transparent;}
  .topic-item:hover{background:var(--panel2);color:var(--ink);}
  .topic-item.active{background:var(--panel2);color:var(--gold);border-left-color:var(--accent);}
  .topic-item.stub{opacity:0.4;cursor:default;font-style:italic;}
  .topic-item.stub:hover{background:none;color:var(--ink-dim);}
  .yield{display:inline-block;font-size:10px;margin-left:4px;}
  #main{flex:1;padding:40px 56px;max-width:840px;margin:0 auto;box-sizing:border-box;}
  .examcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:40px 44px;min-height:300px;}
  .examcard h2{font-size:28px;color:var(--gold);margin:0 0 6px;font-weight:normal;letter-spacing:0.01em;}
  .srcref{color:var(--ink-dim);font-size:13px;margin-bottom:28px;}
  .reveal-btn{background:var(--accent);color:#ffffff;border:none;padding:12px 26px;font-size:15px;border-radius:6px;cursor:pointer;font-family:inherit;letter-spacing:0.02em;}
  .reveal-btn:hover{background:var(--gold);}
  #sidebar{box-shadow:1px 0 0 var(--line);}
  .examcard{box-shadow:0 2px 10px rgba(199,106,16,0.08);}
  .hidden{display:none;}
  #syncModal{display:flex;}
  #syncModal.hidden{display:none;}
  .section{margin-top:34px;}
  .section h3{color:var(--gold);font-size:16px;text-transform:uppercase;letter-spacing:0.06em;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:16px;}
  .monologue{font-size:16.5px;line-height:1.75;}
  .monologue p{margin:0 0 14px;}
  .monologue b{color:inherit;background:none;font-weight:bold;padding:0;border-radius:0;}
  .fmt-toolbar{display:flex;gap:6px;margin-bottom:8px;}
  .fmt-btn{background:var(--panel);border:1.5px solid var(--line);color:var(--ink-dim);padding:4px 10px;border-radius:5px;font-family:inherit;font-size:13px;cursor:pointer;}
  .fmt-btn:hover{border-color:var(--accent);color:var(--ink);}
  .fmt-btn.b{font-weight:bold;}
  .fmt-btn.i{font-style:italic;}
  .fmt-swatch{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line);cursor:pointer;padding:0;}
  .fmt-swatch:hover{border-color:var(--ink-dim);}
  .fmt-divider{width:1px;background:var(--line);margin:2px 2px;}
  .outline{font-size:15px;line-height:1.9;}
  .outline .mv{color:var(--gold);font-weight:bold;display:block;margin-top:10px;}
  .qbank-group{margin-bottom:22px;}
  .qbank-group h4{font-size:13px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-dim);margin:0 0 10px;}

  .qcard .a{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14.5px;color:var(--ink-dim);}
  .qcard.open .a{display:block;}

  .qcard .tag.guess{color:var(--bad);}

  .placeholder{color:var(--ink-dim);font-style:italic;padding:60px 0;text-align:center;}
  .badge{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--panel2);color:var(--ink-dim);margin-left:8px;}

  .dot.shaky{background:var(--bad);border-color:var(--bad);}
  .dot.ok{background:#d99a1e;border-color:#d99a1e;}
  .dot.confident{background:var(--good);border-color:var(--good);}
  .topic-item{display:flex;align-items:center;}
  .topic-item .tname{flex:1;}
  .topic-item.stub .dot{border-color:var(--line);opacity:0.5;}

  .weakspots-toggle{margin:10px 20px 4px;padding:9px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--gold);text-align:center;}
  .weakspots-toggle:hover{background:var(--line);}

  .weakspots-panel .wsp-item:hover{background:var(--line);}
  .weakspots-panel .wsp-empty{font-size:12.5px;color:var(--ink-dim);font-style:italic;padding:4px;}

  .confidence-widget .cw-label{font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-dim);margin-bottom:10px;}
  .conf-btn{background:var(--panel);border:1.5px solid var(--line);color:var(--ink-dim);padding:8px 16px;border-radius:6px;font-family:inherit;font-size:13.5px;cursor:pointer;margin-right:10px;}

  .conf-btn.active-shaky{background:var(--bad);color:#fff;border-color:var(--bad);}
  .conf-btn.active-ok{background:#d99a1e;color:#fff;border-color:#d99a1e;}
  .conf-btn.active-confident{background:var(--good);color:#fff;border-color:var(--good);}

  .qdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle;border:1.5px solid var(--ink-dim);background:transparent;flex-shrink:0;}
  .qdot.shaky{background:var(--bad);border-color:var(--bad);}
  .qdot.ok{background:#d99a1e;border-color:#d99a1e;}
  .qdot.confident{background:var(--good);border-color:var(--good);}

  .practice-qtext{font-size:22px;color:var(--gold);font-weight:normal;line-height:1.4;margin:0 0 24px;}
  .practice-stat-line{margin-top:22px;color:var(--ink-dim);font-size:12px;}

</div>

        "q": "Describe the anatomy of the paranasal sinuses.",

ose to the optic nerve and the sphenoid sinus</strong>, which is why posterior ethmoid disease can cause retrobulbar neuritis.</p>\n<p>The <strong>maxillary sinus is the largest</strong>, around 15 mL, occupying the body of the maxilla. It typically develops asymmetrically and, though usually a single chamber, can have recesses or loculi that complicate diagnosis. It drains through an ostium in its superior medial wall into the ethmoidal infundibulum, which then opens into the middle meatus via the hiatus semilunaris. <strong>Its superior wall forms the orbital floor, transmitting the infraorbital nerve</strong>; <strong>its posterior wall borders the pterygopalatine fossa,</strong> containing the maxillary artery, the pterygopalatine ganglion, and trigeminal/autonomic branches; and <strong>its floor is closely related to the roots of the second premolar and first molar</strong> (the anatomical basis for odontogenic sinusitis)</p>\n<p>The <strong>frontal sinus</strong> is highly variable in size and shape, averaging 4–7 mL, and is absent in about 3–5% of people. <strong>It drains via the frontal infundibulum into the frontal recess at the hiatus semilunaris, into the middle meatus.</strong> Its <strong>floor forms part of the orbital roof,</strong> and its <strong>posterior wall is part of the anterior cranial fossa,</strong> so it's a site where sinus infection or trauma can spread either into the orbit or intracranially.</p>\n<p>The <strong>sphenoid sinus</strong> is the most posterior, sitting at the junction of the anterior and middle cranial fossae, variable in size (0.5–3 mL) and also absent in 3–5% of individuals. It <strong>opens into the spheno-ethmoidal recess above the superior turbinate</strong>. Its <strong>superior wall relates to the cranial fossae, the optic chiasm, and the sella turcica,</strong> giving surgical access to the pituitary,  while <strong>its lateral wall houses the cavernous sinus, internal carotid artery, and multiple cranial nerves</strong>, and <strong>its floor borders the nasopharynx and choana.</strong></p>\n<p>Functionally, <strong>all of this converges on the osteo-meatal complex in the anterior ethmoid-</strong> the shared drainage and ventilation pathway for the frontal, maxillary, and anterior ethmoid cells. Anything obstructing this channel like mucosal swelling, anatomical variation, polyps, <strong>can back up secretions and predispose to sinusitis in multiple sinuses at once,</strong> which is exactly why ethmoidal disease so often precedes and drives maxillary or frontal sinusitis.</p>",

        "a": "Rhinitis is defined by sneezing, rhinorrhea, nasal obstruction, and itching, and it classically evolves through three stages: a <b>dry prodromal stage</b>, a <b>catarrhal stage</b> with watery discharge and red mucosa, and a <b>mucous stage</b> as secretions thicken. It sits in the <b>atopic triad</b> alongside asthma and atopic dermatitis. Etiologically, rhinitis splits into <b>infectious</b> (viral, bacterial, fungal) and <b>non-infectious</b>: <b>allergic rhinitis</b> (the most common form, an IgE-mediated type 1 hypersensitivity reaction) — seasonal, perennial, occupational, or intermittent — versus <b>non-allergic forms</b>, including eosinophilic non-allergic rhinitis, drug-induced rhinitis (aspirin, β-blockers, PDE5 inhibitors), hormonal rhinitis (pregnancy, puberty), and <b>atrophic rhinitis (ozena)</b>, where fibrosis leaves the mucosa dry with foul crusting. In allergic rhinitis, inhaled allergen crosses the mucosa and is picked up by IgE-sensitized mast cells; degranulation releases histamine, prostaglandin D2, and leukotrienes, producing the immediate sneeze-itch-discharge response, with eosinophilic infiltration on biopsy. Diagnosis rests on history plus allergen-specific IgE serology or skin prick testing; endoscopy typically shows pale, boggy turbinates rather than the red mucosa of infective rhinitis. Treatment is stepwise: antihistamines and intranasal corticosteroids first line, adding decongestants or leukotriene antagonists for more severe disease, with turbinate reduction reserved for refractory obstruction. <b>Chronic rhinitis</b>, by contrast, is defined by persistent mucosal hypertrophy — true tissue hypertrophy or chronic hyperemia — driven by repeated infective exacerbations or anatomic factors like septal deviation or polyps, managed conservatively or with turbinate surgery when structural.",

        "q": "What are nasal polyps, and what is their pathogenesis?",
        "a": "Nasal polyps are benign, grape-like inflammatory and hyperplastic outgrowths of the sinonasal mucosa, most often arising in the anterior ethmoidal cells and prolapsing through the middle meatus. Histologically they're loose edematous connective tissue with inflammatory cells and few glands, covered by respiratory epithelium. They're mainly a manifestation of <b>eosinophil-dominated chronic rhinosinusitis</b>: <b>IL-5 is the predominant cytokine</b>, driving eosinophil activation and survival, most pronounced in patients with <b>Samter's triad</b> — asthma, aspirin/NSAID sensitivity, and nasal polyps — where COX inhibition shunts arachidonic acid metabolism toward leukotriene overproduction. In children, polyps should raise suspicion for <b>cystic fibrosis</b>."

        "q": "Describe adenoid hypertrophy: anatomy, etiology, clinical picture, diagnosis, and treatment.",
        "a": "The adenoids are lymphoepithelial tissue in the roof and posterior wall of the nasopharynx, medial to the Eustachian tube openings, forming part of Waldeyer's ring together with the palatine and lingual tonsils — ordinary lymphoid tissue reacting to constant antigenic load, growing through early childhood and normally involuting by adolescence. Adenoid hypertrophy is the most common cause of nasal obstruction in children. <b>Etiology</b> is infectious (adenovirus, EBV, rhinovirus, Streptococcus, H. influenzae) or non-infectious (reflux, allergy, smoke exposure) — but <b>new adenoid hypertrophy in an adult is a red flag</b>, prompting work-up for HIV, lymphoma, or sinonasal malignancy rather than being dismissed as benign. Clinically it produces a <b>nasal/airway cluster</b> (mouth breathing, rhinorrhea, adenoid facies, snoring, sleep-disordered breathing) and a separate <b>otologic cluster</b> (muffled hearing, otalgia, recurrent middle ear infections) from mechanical Eustachian tube obstruction. Severity is graded by nasopharyngeal airway occupation; grade 3–4 is a surgical indication. Diagnosis uses lateral neck radiography and nasopharyngoscopy; acute adenoiditis is managed like tonsillitis with amoxicillin, and adenoidectomy (blind curettage or endoscopic microdebrider/TECCA) is definitive for hypertrophy failing medical therapy. Two differentials for a nasopharyngeal mass in this region are worth knowing: <b>Thornwaldt cyst</b> (the most common epithelial growth of the nasopharynx, a benign notochord/Rathke pouch remnant, usually asymptomatic, no removal needed) and <b>craniopharyngioma</b> (a benign Rathke-pouch-remnant tumor that can mimic adenoid hypertrophy in children but comes with endocrine/visual disturbances, treated surgically ± radiation).",

  "nose-complications": {

      {
        "q": "What are the complications of rhinosinusitis? (orbital, intracranial, vascular, bony)",
        "a": "Complications spread along four broad routes, and which one dominates depends on which sinus is involved, since each has a different weak wall. <b>Local soft-tissue extension</b> gives forehead/upper-lid swelling (frontal sinusitis), lower-lid swelling (ethmoiditis), or cheek swelling (maxillary sinusitis). <b>Orbital</b> complications are the most important, arising mainly from the ethmoid via the paper-thin lamina papyracea, following the <b>Chandler classification</b>: Group I preseptal cellulitis (eyelid edema only) → Group II orbital cellulitis (chemosis, reduced motility) → Group III subperiosteal abscess (proptosis, globe displacement) → Group IV orbital abscess (severe proptosis, vision at risk) → Group V cavernous sinus thrombosis (bilateral eye involvement, ophthalmoplegia, sepsis) — a strict severity ladder, distinguished on CT. <b>Intracranial</b> spread happens by direct bone erosion, emissary veins, or hematogenously: epidural abscess (often clinically silent), subdural abscess, meningitis, or brain abscess (most often from the frontal sinus, with unilateral anosmia and confusion as red flags). <b>Vascular</b>: cavernous sinus thrombosis — bilateral lid edema, proptosis, ophthalmoplegia, papilledema, septic fever — usually via the angular vein from a nasal/lip furuncle or from sphenoiditis. <b>Bony</b>: <b>Pott's puffy tumor</b> — frontal bone osteomyelitis with a boggy scalp swelling and fulminant course, since the diploic space has no anatomic barriers to spread — treated with radical debridement plus bone-penetrating antibiotics.",

        "q": "Describe epistaxis: definition, causes, classification, and anterior vs. posterior vascularization.",
        "a": "Epistaxis is bleeding from the nasal mucosa, and the first organizing split is <b>anterior vs. posterior</b>. <b>Anterior epistaxis</b> (the large majority) arises from <b>Kiesselbach's plexus (Little's area)</b> on the anterior septum, where branches of both the internal carotid (anterior ethmoidal artery) and external carotid (sphenopalatine and superior labial arteries) anastomose superficially — making it easy to visualize and control. <b>Posterior epistaxis</b> is less common but more severe, from <b>Woodruff's plexus</b>/the sphenopalatine artery deeper in the nasal cavity, draining down the throat and never considered innocuous, since it can arise from the ethmoidal or sphenopalatine arteries themselves — harder to see and control, more often needing packing or arterial ligation. Posterior bleeding, or bleeding from the middle/superior meatus, should always prompt examination of the oral cavity and a search for a source beyond the nose (nasopharyngeal/laryngeal tumors, esophageal varices, skull-base vessel injury). <b>Causes</b> are local (idiopathic in children, microtrauma to Kiesselbach's plexus, rhinitis sicca, trauma including skull-base fractures, foreign bodies, a bleeding septal polyp, juvenile nasopharyngeal angiofibroma) or systemic (hypertensive/vascular disease, coagulopathies, uremia, liver failure, pregnancy) — with <b>hereditary hemorrhagic telangiectasia (Osler-Weber-Rendu)</b> deserving special mention for recurrent, multifocal, treatment-resistant bleeding managed with argon plasma coagulation or, severely, Saunders dermoplasty/the Young procedure. Management is stepwise: first-line conservative care (upright, lean forward, firm alar pressure 10–15 minutes, cold compress), then chemical/bipolar cauterization, anterior packing, posterior packing, endoscopic vessel cautery, embolization, and finally vascular ligation for uncontrolled bleeding.",

        "q": "Describe juvenile nasopharyngeal angiofibroma: epidemiology, site of growth, symptoms, diagnosis, and treatment.",
        "a": "Juvenile nasopharyngeal angiofibroma (JNA) is the tumor to know cold here: a histologically benign but locally aggressive, highly vascular tumor arising from the superior margin of the sphenopalatine foramen, occurring almost exclusively in <b>adolescent males (14–25 years)</b>, reflecting hormone sensitivity. Fed primarily by the internal maxillary artery, it invades the pterygopalatine fossa and nasal cavity, extending as it advances into the paranasal sinuses, orbit, and even intracranially. Presentation is classically <b>unilateral nasal obstruction with profuse or recurrent epistaxis</b>, sometimes with facial dysmorphism, conductive hearing loss (Eustachian tube obstruction), or diplopia with orbital extension. Staging runs IA (confined to nose/nasopharynx) → IIA–IIC (pterygomaxillary fossa) → IIIA–IIIB (skull base erosion ± intracranial extension). Diagnosis is CT and MRI — <b>biopsy is contraindicated</b> given catastrophic hemorrhage risk. Treatment is preoperative embolization followed by surgical resection, usually endoscopic today.",

        "a": "The pharynx is a muscular conductive tube in the midline of the neck, narrowing from above downward, divided into three compartments — each with its own anterior opening — and the boundaries between them are exactly what an examiner will probe first. The <b>nasopharynx is bounded superiorly by the skull base and inferiorly by an imaginary plane through the soft palate</b>, sitting behind the choanae and opening anteriorly into the nasal cavity; its lateral walls carry the two Eustachian tube openings, each surrounded by a tubal elevation. The <b>oropharynx extends from that soft-palate plane down to the superior edge of the epiglottis</b>, opening anteriorly into the oral cavity via the faucial isthmus (bounded by the palatoglossal arch), and contains the tonsillar region between the palatoglossal and palatopharyngeal arches. The <b>hypopharynx runs from the upper border of the epiglottis down to the lower border of the cricoid cartilage, at the level of C6</b>, opening anteriorly into the laryngeal inlet before continuing as the esophagus."

      {
        "q": "Describe dysphagia: definition, and the oropharyngeal vs. esophageal classification.",
        "a": "Dysphagia is an abnormal delay in bolus transit to the stomach, which may be acute or chronic, and can come with globus sensation or odynophagia. The first branch point in any answer is <b>oropharyngeal vs. esophageal dysphagia</b>, since they point to completely different diagnostic pathways. <b>Oropharyngeal dysphagia</b> — a problem transiting the voluntary-to-involuntary transition — has anatomical causes (Zenker diverticulum, webs, goiter, oropharyngeal tumors, external compression such as an aortic aneurysm — \"dysphagia aortica\"), neuromuscular causes (stroke, Parkinson's, ALS, MS, myasthenia gravis, botulism), muscular causes (polymyositis, myopathy), and iatrogenic causes (post cervical spine surgery); clinically it presents with difficulty initiating the swallow, cough immediately after swallowing, nasal regurgitation, and globus sensation. <b>Esophageal dysphagia</b> splits into mechanical obstruction — usually solids only, from a Schatzki ring, stricture, carcinoma, or eosinophilic esophagitis — versus motility disorder, affecting solids and liquids equally, from achalasia, diffuse esophageal spasm, or systemic sclerosis; clinically it presents seconds after swallowing, with a sensation localized to the chest and true regurgitation of undigested food.",

        "q": "Describe obstructive sleep apnea: definition, risk factors, diagnosis, and treatment.",
        "a": "OSA is repetitive collapse of the upper airway during sleep causing partial (hypopnea) or complete (apnea) cessation of airflow despite ongoing respiratory effort — distinguishing it from central sleep apnea, where respiratory effort itself ceases. Risk factors: obesity (dominant), male sex, retrognathia/micrognathia, macroglossia, tonsillar hypertrophy (especially in children), and family history. Diagnosis: <b>polysomnography is the gold standard</b>, quantifying the apnea-hypopnea index (AHI) to grade severity, alongside oxygen desaturation and sleep architecture disruption; screening tools (Epworth Sleepiness Scale, STOP-BANG) identify who needs formal testing. Treatment is stepped: weight loss and positional therapy for mild disease, <b>CPAP as first-line therapy</b> for moderate-severe disease, oral mandibular advancement devices as an alternative, and surgery (UPPP, adenotonsillectomy in children, maxillomandibular advancement in select adults) reserved for anatomically correctable cases or CPAP failure.",

      {
        "q": "What are the formal definitions of apnea and hypopnea, and how is OSA severity graded?",
        "a": "<b>Apnea</b> = complete cessation of airflow for ≥10 seconds. <b>Hypopnea</b> = ≥30% flow reduction for ≥10s with ≥4% oxygen desaturation (or 50%/3% by the alternative definition). The <b>apnea-hypopnea index (AHI)</b> grades severity: normal 0–5, mild 6–15, moderate 16–30, severe &gt;30 events/hour. Mechanistically, the pharynx lacks rigid structural support, so all three segments (naso-, oro-, hypopharynx) are collapsible; by the <b>Bernoulli principle</b>, airflow through a narrowed segment speeds up and pressure drops further, worsening collapse — normally counteracted by genioglossus, tensor palatini, and pharyngeal dilator muscle tone, which is reduced during sleep (more so in OSAS)."
      },

        "q": "How is OSA treated surgically, organized by anatomic level?",
        "a": "Surgery is organized by anatomic level. <b>Level 1 (nose)</b> improves sleep quality without curing OSAS itself, though combined <b>adenotonsillectomy cures 85–90% of pediatric OSAS</b> since tonsillar/adenoid hypertrophy is the dominant pediatric cause. <b>Level 2 (palate)</b> — uvulopalatopharyngoplasty (UPPP), radiofrequency, or suspension techniques. <b>Level 3 (tongue base)</b> — radiofrequency, SMILE, robotic (TORS) resection, or hyoid suspension. <b>Maxillomandibular advancement</b> is the most effective single surgical option (&gt;90% success) but is reserved for severe disease after conservative measures fail, given facial-appearance and paresthesia risks. Surgical indications generally require CPAP failure/intolerance, AHI &gt;15 (or 5–15 with daytime sleepiness), oxygen desaturation &lt;90%, or obstruction-related arrhythmias."

  "larynx-anat": {
    "coreQA": [
      {
        "q": "Describe the cartilaginous skeleton and internal cavity of the larynx, including its three compartments.",
        "a": "The larynx is a cartilaginous respiratory-tract structure in the anterior neck, developing from a two-part embryologic anlage — supraglottis from the buccopharyngeal bud, glottis and subglottis from the tracheobronchial bud — and it descends with age, from C2 at birth to C3–C6 in the adult (roughly C5 at rest). Its two core functions are airway protection (aspiration prevention, cough reflex) and phonation. The skeleton has <b>nine cartilages</b>: three unpaired hyaline cartilages (thyroid, cricoid) plus the fibrous epiglottis, and three paired cartilages (arytenoid — hyaline; corniculate of Santorini and cuneiform of Wrisberg — both fibroelastic and functionless). The internal cavity is pyramid-shaped, base toward the tongue, apex toward the trachea, and divides into three compartments with precise boundaries: the <b>supraglottis</b> (epiglottis, aryepiglottic folds, arytenoids, false cords, piriform sinuses — roofed by the hyo-epiglottic ligament, respiratory epithelium); the <b>glottis</b> (true vocal cords, anterior/posterior commissures, floor of Morgagni's ventricle — squamous epithelium, essentially no glands or lymphatics); and the <b>subglottis</b> (inferior vocal cord face down to the cricoid's lower margin — respiratory epithelium again). The true vocal cords are the inferior pair — the only ones able to appose each other — while the superior pair (false cords) are thin, ribbon-like, and muscle-free. Two membranes matter surgically: the <b>thyrohyoid membrane</b>, carrying the superior laryngeal artery/vein and the internal branch of the superior laryngeal nerve; and the <b>cricothyroid membrane</b> — the closest point of the airway to the skin, and the site for emergency cricothyrotomy."
      },
      {
        "q": "Describe the muscles of the larynx and their actions.",
        "a": "Laryngeal muscles fall into two functional groups. <b>Intrinsic muscles control the glottis</b>: cricothyroid tenses/elongates the folds to raise pitch, and is the only one supplied by the <b>external branch of the superior laryngeal nerve</b> rather than the recurrent laryngeal nerve — a favorite isolated exam fact; posterior cricoarytenoid is the <b>sole abductor</b>, opening the airway; lateral cricoarytenoid and the arytenoid muscles adduct, closing the glottis; thyroarytenoid relaxes the fold and fine-tunes tension. <b>Extrinsic muscles reposition the whole larynx</b> — elevators (thyrohyoid, stylopharyngeus, palatopharyngeus, and others) versus depressors (sternothyroid and others) — mediating the laryngeal elevation that protects the airway during swallowing."
      },
      {
        "q": "Describe the vascular supply, lymphatic drainage, and innervation of the larynx, including the course of the recurrent laryngeal nerve.",
        "a": "Blood supply splits at the glottis: <b>supraglottic structures via the superior laryngeal artery</b> (from the superior thyroid artery, external carotid); <b>subglottic structures via the inferior laryngeal artery</b> (from the inferior thyroid artery, thyrocervical trunk). Lymphatics follow the same split and this is oncologically critical: the <b>supraglottis is lymphatically rich, the subglottis sparse, and the true vocal cord itself has essentially no lymphatics at all</b> — exactly why glottic cancer behaves so differently, nodally, from supraglottic cancer. Innervation is entirely from the <b>vagus nerve (CN X)</b>, via two branches: the <b>superior laryngeal nerve</b> splits into an internal branch (pure sensory, down to the glottis) and an external branch (pure motor, to cricothyroid only); the <b>recurrent laryngeal nerve</b> supplies motor function to every other intrinsic muscle and sensation below the glottis. Its course is the classic exam anatomy: the <b>right RLN loops around the subclavian artery</b>, while the <b>left RLN loops around the aortic arch</b> — because of the asymmetric embryologic development of the great vessels — both then ascending in the tracheoesophageal groove to enter the larynx near the inferior thyroid cornu, typically reconnecting with the internal laryngeal nerve via the ansa/Galen anastomosis. Its intimate relationship to the inferior thyroid artery and thyroid gland is exactly why thyroid surgery is the classic iatrogenic cause of RLN palsy."
      },
      {
        "q": "Describe the physiology of phonation, airway protection, and how the larynx is clinically examined.",
        "a": "Phonation follows Perelló's <b>muco-undulatory theory</b>: subglottic pressure forces the vocal folds apart, then the Bernoulli effect pulls them back together — a rapid cycle producing sound, visualized clinically by stroboscopy. Voice is shaped further by resonance in the vocal tract, and costal-diaphragmatic breathing is more efficient for sustained phonation than apical breathing. Beyond voice, the larynx protects the airway during swallowing (glottic closure plus 2–3cm laryngeal elevation) and mediates the cough reflex and thoracic fixation needed for straining/lifting. <b>Examination</b> runs from simple inspection/palpation, through indirect mirror exam and flexible/rigid endoscopy, to stroboscopy (evaluating the mucosal wave and glottal closure pattern) and specialized tools — EMG, high-speed glottography, narrow-band imaging/autofluorescence for early malignancy, and acoustic spectrograms."
      },
      {
        "q": "Recurrent laryngeal nerve — why is it called \"recurrent\"? Course, differences left vs right",
        "a": "The recurrent laryngeal nerve is called \"recurrent\" because, after branching from the vagus nerve in the neck/upper thorax, it travels <b>downward into the chest before looping back (\"recurring\") upward</b> to reach the larynx — rather than taking a direct route. Its course differs by side because of the different embryological fate of the great vessels: the <b>right recurrent laryngeal nerve loops under the right subclavian artery</b> at the base of the neck, giving it a relatively short thoracic course, while the <b>left recurrent laryngeal nerve descends much further into the thorax and loops under the aortic arch</b> (specifically posterior to the ligamentum arteriosum) before ascending back to the larynx in the tracheoesophageal groove. This longer intrathoracic course on the left is exactly why the left recurrent laryngeal nerve is more frequently affected by intrathoracic pathology (mediastinal masses, aortic aneurysm, left-sided lung or esophageal tumors) than the right, and why left-sided vocal cord palsy is more common overall than right-sided.",
        "src": "Extremely frequently asked — one of the single highest-yield facts in the whole ENT syllabus"

        "q": "Describe the submucosal spaces of the larynx, and the extrinsic vs. intrinsic ligament classification.",
        "a": "The laryngeal submucosa forms a single compartment subdivided by ligaments and membranes into three potential spaces — clinically important because they're routes for tumor spread: the <b>pre-epiglottic space</b>, the <b>paraglottic space</b> (anterior and posterior parts), and the <b>subglottic space</b>. Ligaments split into two functional groups: <b>extrinsic ligaments</b> (thyrohyoid, hyo-epiglottic, cricotracheal) anchor the larynx to neighboring structures like the hyoid and trachea; <b>intrinsic ligaments</b> (cricothyroid, cricocorniculate, thyroepiglottic, thyroarytenoid, arytenoid-epiglottic) connect the laryngeal cartilages to each other, including the <b>conus elasticus</b>, the internal connective-tissue membrane linking the cartilaginous framework."

        "a": "Salivary glands are exocrine glands secreting saliva into the oral cavity, split into major glands (extrinsic, 90% of volume, stimulated secretion) and minor glands (intrinsic, 10%, continuous automatic secretion), developing embryologically from ectodermal foregut aggregations between weeks 4–8. The <b>parotid</b> is the largest, sitting in the retromandibular fossa. Its six boundaries: <b>anteriorly</b> the ascending ramus of the mandible; <b>posteriorly</b> the external acoustic meatus and sternocleidomastoid; <b>superiorly</b> the zygomatic arch; <b>inferiorly</b> the anterior margins of sternocleidomastoid and posterior digastric; <b>laterally</b> the masseter; <b>medially</b> the medial pterygoid, the jugulo-carotid tract, the styloid process (with Riolan's bundle), and the pharyngeal wall. The <b>facial nerve</b> and posterior facial vein divide it into a superficial lobe (lateral, overlying masseter) and deep lobe (medial, between the mastoid and mandibular ramus) — this distinction matters surgically, since deep-lobe tumors can bulge into the oropharynx/parapharyngeal space and need more extensive facial-nerve dissection to access. Its duct — <b>Stensen's duct</b>, about 6cm — runs over masseter, pierces buccinator, and opens opposite the maxillary second molar; it's a purely serous gland. Arterial supply is from the external carotid's terminal branches (superficial temporal, transverse facial, maxillary), draining via the retromandibular vein.",

  "audio-mid-ear": {

      {
        "q": "What is the underlying pathophysiologic framework of chronic middle ear disease?",
        "a": "Chronic middle ear disease reduces to two intertwined functional disturbances: <b>impaired ventilation (Eustachian tube dysfunction) and inflammation</b> — each drives the other in a vicious circle. When the tube fails to open on swallowing (tensor veli palatini dysfunction, mucosal swelling from neighboring inflammation/allergy, adenoid obstruction, or nasopharyngeal tumor infiltration), trapped middle-ear air resorbs, dropping pressure and irritating the mucosa; long-standing occlusion drives <b>metaplasia of the mucoperiosteum into mucus-secreting columnar epithelium</b>, producing a seromucinous exudate that itself worsens aeration. This single framework — a stuck tube plus a reactive mucosa — is the starting point for essentially every entity covered in the rest of this topic, from a simple blocked ear after a cold through to cholesteatoma."

        "q": "Describe acute otitis media: pathophysiology, organisms, clinical phases, and treatment.",

        "a": "The <b>otolith-ocular (vestibulo-collic) reflex</b> uses the utricle and saccule to keep the eyes aligned with the horizon during head tilt; its breakdown produces the <b>ocular tilt reaction</b> (head/neck tilt, skew deviation, ocular torsion), pointing to vestibular-nuclei/brainstem pathology. The <b>vestibulo-ocular reflex (VOR)</b> generates an eye movement equal and opposite to head movement to keep the retinal image stable, integrating semicircular canals and otolith organs. The <b>vestibulospinal reflex</b> uses the same vestibular input to drive postural/limb responses via the vestibulospinal tracts, keeping the body upright against gravity."

        "a": "Presbycusis is progressive, irreversible, bilateral symmetric age-related SNHL — the single most common cause of hearing loss, affecting <b>1 in 3 people by 65 and 1 in 2 by 75</b>. Four phenotypes: <b>sensory</b> (hair cell loss, sharply sloping high-frequency loss), <b>neural</b> (spiral ganglion loss, gradual downward slope), <b>strial/metabolic</b> (stria vascularis atrophy, classically a <b>flat audiogram</b>), and <b>cochlear conductive</b> (basilar membrane stiffening, unverified). Diagnosis: sensorineural pattern with <b>no air-bone gap</b>, normal Type A tympanogram, OAE vs ABR failure localizing cochlear vs CN VIII pathology. Because it's fundamentally degenerative, it <b>cannot be prevented, reversed, or cured</b> — management is amplification (hearing aids, then cochlear implants) and aural rehabilitation; unilateral or pulsatile tinnitus should still prompt a search for a separate cause.",

// ---------- EDITABLE CONTENT / PERSISTENCE ----------
// A deep working copy of CONTENT that edits are applied to. Topic name/ref edits
// are applied directly onto the REGIONS objects (mutating them in place is fine —
// they're only ever read from REGIONS itself).
let workingContent = JSON.parse(JSON.stringify(CONTENT));
const OVERRIDES_KEY = 'entOralExamHub_overrides_v1';
let touchedTopicIds = new Set();
try {
  const saved = JSON.parse(localStorage.getItem(OVERRIDES_KEY) || 'null');
  if (saved) {
    if (saved.content) {
      Object.keys(saved.content).forEach(id => {
        const savedTopic = saved.content[id];
        const freshTopic = workingContent[id];
        const savedIsEmpty = savedTopic &&
          (!savedTopic.coreQA || savedTopic.coreQA.length === 0) &&
          (!savedTopic.additionalQA || savedTopic.additionalQA.length === 0);
        const freshHasContent = freshTopic &&
          ((freshTopic.coreQA && freshTopic.coreQA.length > 0) || (freshTopic.additionalQA && freshTopic.additionalQA.length > 0));
        if (savedIsEmpty && freshHasContent) {
          // This looks like a stale/corrupted save from an older version of the hub rather than
          // a deliberate edit — skip it and keep the freshly-shipped content instead of overwriting it.
          return;
        }
        workingContent[id] = savedTopic;
        touchedTopicIds.add(id);
      });
    }
    if (saved.topics) {
      saved.topics.forEach(st => {
        REGIONS.forEach(region => {
          const t = region.topics.find(tp => tp.id === st.id);
          if (t) { if (typeof st.name === 'string') t.name = st.name; if (typeof st.ref === 'string') t.ref = st.ref; }
        });
      });
    }
  }
} catch (e) { /* ignore corrupt storage */ }

let saveTimer = null;
function persistOverrides(touchedId) {
  if (touchedId) touchedTopicIds.add(touchedId);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const topics = [];
    REGIONS.forEach(region => region.topics.forEach(t => { if (t.built) topics.push({ id: t.id, name: t.name, ref: t.ref }); }));
    // Only persist topics actually touched in edit mode — never the whole content object —
    // so editing one topic can never freeze/overwrite every other topic's data on reload.
    const contentOut = {};
    touchedTopicIds.forEach(id => { if (workingContent[id]) contentOut[id] = workingContent[id]; });
    try {
      localStorage.setItem(OVERRIDES_KEY, JSON.stringify({ content: contentOut, topics }));
    } catch (e) { /* storage full or unavailable — edits still hold in memory */ }
  }, 300);
}

let editMode = false;

function exportUpdatedFile() {
  let out = PAGE_TEMPLATE;
  const regionsJSON = JSON.stringify(REGIONS, null, 2);
  const contentJSON = JSON.stringify(workingContent, null, 2);
  out = out.replace(
    /\/\* @DATA:REGIONS:START \*\/[\s\S]*?\/\* @DATA:REGIONS:END \*\//,
    `/* @DATA:REGIONS:START */\nconst REGIONS = ${regionsJSON};\n/* @DATA:REGIONS:END */`
  );
  out = out.replace(
    /\/\* @DATA:CONTENT:START \*\/[\s\S]*?\/\* @DATA:CONTENT:END \*\//,
    `/* @DATA:CONTENT:START */\nconst CONTENT = ${contentJSON};\n/* @DATA:CONTENT:END */`
  );
  const blob = new Blob([out], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'oral_exam_hub.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// ---------- CONFIDENCE TRACKING (localStorage) ----------
const CONF_KEY = 'entOralExamHub_confidence_v1';
const CONF_LEVELS = ['shaky', 'ok', 'confident'];
const CONF_LABEL = { shaky: 'Shaky', ok: 'Getting there', confident: 'Confident' };
let confidenceStore = {};
try {
  confidenceStore = JSON.parse(localStorage.getItem(CONF_KEY) || '{}');
} catch (e) { confidenceStore = {}; }

function persistConfidence() {
  try { localStorage.setItem(CONF_KEY, JSON.stringify(confidenceStore)); } catch (e) {}
}
function getConf(id) { return confidenceStore[id] || null; }
function setConf(id, level) {
  if (confidenceStore[id] === level) delete confidenceStore[id]; // click again to clear
  else confidenceStore[id] = level;
  persistConfidence();
  refreshDot(id);
  renderWeakSpots();
}
function refreshDot(id) {
  const dot = document.querySelector(`.dot[data-dot-for="${id}"]`);
  if (!dot) return;
  dot.className = 'dot' + (getConf(id) ? ' ' + getConf(id) : '');
}

// ---------- PER-QUESTION CONFIDENCE TRACKING (localStorage) ----------
const QCONF_KEY = 'entOralExamHub_qconfidence_v1';
let qConfidenceStore = {};
try {
  qConfidenceStore = JSON.parse(localStorage.getItem(QCONF_KEY) || '{}');
} catch (e) { qConfidenceStore = {}; }

function persistQConfidence() {
  try { localStorage.setItem(QCONF_KEY, JSON.stringify(qConfidenceStore)); } catch (e) {}
}
function getQConf(qid) { return (qConfidenceStore[qid] && qConfidenceStore[qid].level) || null; }
function bumpQSeen(qid) {
  const entry = qConfidenceStore[qid] || { level: null, seen: 0 };
  entry.seen = (entry.seen || 0) + 1;
  qConfidenceStore[qid] = entry;
  persistQConfidence();
}
function setQConf(qid, level) {
  const entry = qConfidenceStore[qid] || { level: null, seen: 0 };
  entry.level = (entry.level === level) ? null : level; // click again to clear
  qConfidenceStore[qid] = entry;
  persistQConfidence();
}
function qconfWidgetHTML(qid) {
  const current = getQConf(qid);
  const btns = CONF_LEVELS.map(lvl =>
    `<button class="qconf-btn${current === lvl ? ' active-' + lvl : ''}" data-qid="${qid}" data-lvl="${lvl}">${CONF_LABEL[lvl]}</button>`
  ).join('');
  return `<div class="qconf-row" data-qconf-for="${qid}">${btns}</div>`;
}
function wireQConfButtons(container) {
  container.querySelectorAll('.qconf-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const qid = btn.getAttribute('data-qid');
      const lvl = btn.getAttribute('data-lvl');
      setQConf(qid, lvl);
      const row = container.querySelector(`.qconf-row[data-qconf-for="${CSS.escape(qid)}"]`);
      if (row) {
        row.querySelectorAll('.qconf-btn').forEach(b => {
          b.className = 'qconf-btn' + (b.getAttribute('data-lvl') === getQConf(qid) ? ' active-' + getQConf(qid) : '');
        });
      }
      const qdot = container.querySelector(`.qdot[data-qdot-for="${CSS.escape(qid)}"]`);
      if (qdot) qdot.className = 'qdot' + (getQConf(qid) ? ' ' + getQConf(qid) : '');
    });
  });
}

// ---------- RENDER ----------
const regionList = document.getElementById('region-list');
const FLAT_TOPICS = []; // {topic, region, itemEl}

REGIONS.forEach(region => {
  const wrap = document.createElement('div');
  wrap.className = 'region';
  const head = document.createElement('div');
  head.className = 'region-head';
  head.innerHTML = `<span>${region.name}</span><span class="region-status">${region.status}</span>`;
  const list = document.createElement('div');
  list.className = 'topic-list';
  region.topics.forEach(t => {
    const item = document.createElement('div');
    item.className = 'topic-item' + (t.built ? '' : ' stub');
    const dotHTML = t.built ? `<span class="dot ${getConf(t.id) || ''}" data-dot-for="${t.id}"></span>` : `<span class="dot"></span>`;
    const redirectBadge = (!t.built && t.redirect) ? ` <span class="badge">→ see full topic</span>` : '';
    item.innerHTML = `${dotHTML}<span class="tname">${t.name}</span> <span class="yield">${YIELD_ICON[t.yield]}</span>${redirectBadge}`;
    if (t.built) {
      item.addEventListener('click', () => selectTopic(t, item));
      FLAT_TOPICS.push({ topic: t, region, itemEl: item, listEl: list });
    } else if (t.redirect) {
      item.classList.remove('stub');
      item.style.cursor = 'pointer';
      item.title = 'Click to jump to the full topic';
      item.addEventListener('click', () => jumpToTopicId(t.redirect));
    } else {
      item.title = 'Not built yet';
    }
    list.appendChild(item);
  });
  head.addEventListener('click', () => list.classList.toggle('collapsed'));
  wrap.appendChild(head);
  wrap.appendChild(list);
  regionList.appendChild(wrap);
});

// ---------- COMPRESSION HELPERS (gzip + base64url, with plain-text fallback) ----------
function b64urlEncode(bytes) {
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlDecode(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  const binary = atob(str);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
async function compressText(text) {
  if (!window.CompressionStream) {
    return 'P' + b64urlEncode(new TextEncoder().encode(text));
  }
  const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return 'C' + b64urlEncode(new Uint8Array(buf));
}
async function decompressText(packed) {
  const flag = packed[0];
  const bytes = b64urlDecode(packed.slice(1));
  if (flag === 'P') return new TextDecoder().decode(bytes);
  if (!window.DecompressionStream) throw new Error('This browser can\'t decompress this data — try the plain-text/file option instead.');
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return new TextDecoder().decode(buf);
}

// ---------- SYNC (one unified bundle: content edits + confidence tracking) & RESET ----------
function buildProgressBundle() {
  const contentOut = {};
  touchedTopicIds.forEach(id => { if (workingContent[id]) contentOut[id] = workingContent[id]; });
  const topicMeta = [];
  REGIONS.forEach(region => region.topics.forEach(t => { if (t.built) topicMeta.push({ id: t.id, name: t.name, ref: t.ref }); }));
  return {
    type: 'ent-oral-exam-hub-bundle',
    exportedAt: new Date().toISOString(),
    confidence: confidenceStore,
    qConfidence: qConfidenceStore,
    contentOverrides: contentOut,
    topicMeta
  };
}

function closeSyncModal() {
  document.getElementById('syncModal').classList.add('hidden');
}

function applyImportedBundle(data) {
  const hasAnything = data && (data.confidence || data.qConfidence || data.contentOverrides || data.topicMeta);
  if (!hasAnything) {
    alert('That doesn\'t contain any recognizable sync data.');
    return false;
  }
  if (data.confidence) Object.assign(confidenceStore, data.confidence);
  if (data.qConfidence) Object.assign(qConfidenceStore, data.qConfidence);
  if (data.contentOverrides) {
    Object.keys(data.contentOverrides).forEach(id => {
      workingContent[id] = data.contentOverrides[id];
      touchedTopicIds.add(id);
    });
  }
  if (data.topicMeta) {
    data.topicMeta.forEach(st => {
      REGIONS.forEach(region => {
        const t = region.topics.find(tp => tp.id === st.id);
        if (t) { if (typeof st.name === 'string') t.name = st.name; if (typeof st.ref === 'string') t.ref = st.ref; }
      });
    });
  }
  persistConfidence();
  persistQConfidence();
  persistOverrides();
  return true;
}

async function openSyncModal() {
  const bundle = buildProgressBundle();
  const jsonText = JSON.stringify(bundle);
  const dateStr = new Date().toISOString().slice(0, 10);

  try { packed = await compressText(jsonText); } catch (e) { packed = 'P' + b64urlEncode(new TextEncoder().encode(jsonText)); }
  const baseUrl = location.href.split('#')[0];
  const qrPayload = `${baseUrl}#sync=${packed}`;
  const qrFits = qrPayload.length <= 1400 && window.QRCode;

  body.innerHTML = `
    <h3 style="margin-top:0;">Sync between devices</h3>
    <p style="color:var(--ink-dim);font-size:13.5px;">Bundles your confidence marks <b>and</b> content edits together, compressed into a short code. No account or internet needed for the transfer itself.</p>

    ${qrFits ? `

    <div id="syncQR" style="background:#fff;padding:12px;border-radius:8px;display:inline-block;"></div>
    <p style="color:var(--ink-dim);font-size:12.5px;margin-top:8px;">Open your phone's camera app and point it at this code — no typing, no messaging app. It reopens this same page with your sync data ready to confirm.</p>
    ` : `
    <p style="color:var(--ink-dim);font-size:12.5px;background:var(--panel2);padding:10px;border-radius:6px;">You've got enough tracked data that a QR code isn't reliably scannable anymore — use the code or file below instead.</p>
    `}

    <h4 style="margin:18px 0 6px;">Or copy a short code (${packed.length} characters — safe to paste anywhere, including a chat message)</h4>
    <button class="conf-btn active-confident" id="syncCopyBtn" style="margin-bottom:10px;">📋 Copy to clipboard</button>
    <span id="syncCopyStatus" style="margin-left:10px;color:var(--good);font-size:13px;"></span>
    <textarea id="syncExportText" readonly style="width:100%;height:70px;font-family:monospace;font-size:11px;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);box-sizing:border-box;">${packed}</textarea>

    <h4 style="margin:18px 0 6px;">Import into this device</h4>
    <textarea id="syncImportText" placeholder="Paste the code from another device here..." style="width:100%;height:70px;font-family:monospace;font-size:11px;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);box-sizing:border-box;"></textarea>
    <button class="conf-btn active-confident" id="syncImportTextBtn" style="margin-top:10px;">Import from pasted code</button>

    <div style="margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);">
      <button class="mini-btn" id="syncDownloadBtn">⬇️ Download as file instead</button>
      <button class="mini-btn" id="syncChooseFileBtn">📁 Import from file instead</button>

    </div>

    <div style="margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);">
      <button class="mini-btn" id="syncResetBtn" style="color:var(--bad);">🗑 Reset everything on this device</button>
    </div>
  `;

  if (qrFits) {
    try {
      new QRCode(document.getElementById('syncQR'), { text: qrPayload, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.L });
    } catch (e) { /* copy/paste path below still works if QR rendering fails */ }
  }

  document.getElementById('syncCopyBtn').addEventListener('click', () => {
    const ta = document.getElementById('syncExportText');
    const status = document.getElementById('syncCopyStatus');
    const fallback = () => {
      ta.removeAttribute('readonly');
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); status.textContent = 'Copied!'; }
      catch (e) { status.textContent = 'Selected — copy with your keyboard/menu.'; }
      ta.setAttribute('readonly', 'readonly');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(packed).then(() => { status.textContent = 'Copied!'; }).catch(fallback);
    } else { fallback(); }
    setTimeout(() => { status.textContent = ''; }, 3000);
  });

  document.getElementById('syncDownloadBtn').addEventListener('click', () => {
    const blob = new Blob([packed], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ent-hub-sync-${dateStr}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

  document.getElementById('syncImportTextBtn').addEventListener('click', async () => {

  });

      'Reset EVERYTHING on this device?\n\n' +
      'This clears all confidence marks (topic and per-question) AND all content edits, reverting to the ' +
      'original shipped material. This cannot be undone — copy the code above first if you want a backup.'
    );
    if (!sure) return;
    confidenceStore = {};
    qConfidenceStore = {};
    touchedTopicIds = new Set();
    persistConfidence();
    persistQConfidence();
    try { localStorage.removeItem(OVERRIDES_KEY); } catch (e) {}
    location.reload();
  });
}

// Accepts either our packed/compressed short code, or a legacy raw-JSON export from an older version.
async function tryApplySyncCode(raw) {
  raw = (raw || '').trim();
  if (!raw) { alert('Paste or choose the sync code first.'); return false; }
  let data;
  try {
    data = JSON.parse(raw); // legacy plain-JSON export
  } catch (e) {
    try {
      const text = await decompressText(raw);
      data = JSON.parse(text);
    } catch (e2) {
      alert('That doesn\'t look like a valid sync code — make sure you copied/selected the whole thing.');
      return false;
    }
  }
  return applyImportedBundle(data);
}

  const found = FLAT_TOPICS.find(f => f.topic.id === id);
  if (found) {
    found.listEl.classList.remove('collapsed');
    selectTopic(found.topic, found.itemEl);
    found.itemEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}
function renderWeakSpots() {
  if (weakspotsPanel.classList.contains('hidden')) return;
  const weak = FLAT_TOPICS.filter(f => getConf(f.topic.id) === 'shaky' || getConf(f.topic.id) === 'ok')
    .sort((a, b) => {
      const order = { shaky: 0, ok: 1 };
      return order[getConf(a.topic.id)] - order[getConf(b.topic.id)];

    weakspotsPanel.innerHTML = `<div class="wsp-title">Weak spots</div><div class="wsp-empty">Nothing marked shaky or "getting there" yet — rate a topic after you rehearse it.</div>`;

// ---------- PRACTICE MODE (random Q&A / "Anki") ----------
let practiceFilters = { includeExtra: false, weakOnly: false, weakFirst: false };
let currentPracticeQ = null;

function buildFlatQuestions() {
  const out = [];
  REGIONS.forEach(region => region.topics.forEach(topic => {
    if (!topic.built) return;
    const c = workingContent[topic.id];
    if (!c) return;
    (c.coreQA || []).forEach((qa, i) => {
      out.push({ id: `${topic.id}::core::${i}`, topic, region, q: qa.q, a: qa.a, src: qa.src, kind: 'core' });
    });
    (c.additionalQA || []).forEach((qa, i) => {
      out.push({ id: `${topic.id}::extra::${i}`, topic, region, q: qa.q, a: qa.a, kind: 'extra' });
    });
  }));
  return out;
}

function pickRandomQuestion() {
  let pool = buildFlatQuestions().filter(q => practiceFilters.includeExtra || q.kind === 'core');
  if (practiceFilters.weakOnly) {
    pool = pool.filter(q => { const conf = getConf(q.topic.id); return conf === 'shaky' || conf === 'ok'; });
  }
  if (!pool.length) return null;

  if (practiceFilters.weakFirst) {
    const shaky = pool.filter(q => getQConf(q.id) === 'shaky');
    if (shaky.length) return shaky[Math.floor(Math.random() * shaky.length)];
    const gettingThere = pool.filter(q => getQConf(q.id) === 'ok');
    if (gettingThere.length) return gettingThere[Math.floor(Math.random() * gettingThere.length)];
    // nothing marked weak — fall through to normal weighting below rather than dead-ending
  }

  const weighted = [];
  pool.forEach(q => {
    const lvl = getQConf(q.id);
    let w = 4; // unmarked/unseen gets high priority
    if (lvl === 'shaky') w = 5;
    else if (lvl === 'ok') w = 2;
    else if (lvl === 'confident') w = 1;
    for (let i = 0; i < w; i++) weighted.push(q);
  });
  return weighted[Math.floor(Math.random() * weighted.length)];
}

function renderPractice() {
  practiceMode = true;
  editMode = false;
  editModeToggle.textContent = '✏️ Turn on edit mode';
  editModeToggle.style.color = '';
  if (activeItem) { activeItem.classList.remove('active'); activeItem = null; }
  activeTopic = null;
  const card = document.getElementById('card');
  const q = pickRandomQuestion();
  currentPracticeQ = q;
  if (q) bumpQSeen(q.id);

  const filterRow = `
    <div class="practice-filters">
      <label><input type="checkbox" id="fltExtra" ${practiceFilters.includeExtra ? 'checked' : ''}> Include quick-fire/additional questions</label>
      <label><input type="checkbox" id="fltWeak" ${practiceFilters.weakOnly ? 'checked' : ''}> Only weak-spot topics</label>
      <label><input type="checkbox" id="fltWeakFirst" ${practiceFilters.weakFirst ? 'checked' : ''}> Review my Shaky/Getting-there questions first</label>
    </div>`;

  if (!q) {
    card.innerHTML = `<div class="placeholder">No questions match these filters yet.</div>${filterRow}`;
    wireFilterRow(card);
    return;
  }

  const entry = qConfidenceStore[q.id] || { level: null, seen: 0 };
  card.innerHTML = `
    <div class="practice-crumb">${q.region.name} → ${q.topic.name} <span class="badge">${q.kind === 'core' ? 'Core' : 'Quick fact'}</span></div>
    ${filterRow}
    <div class="practice-qtext">${q.q}</div>
    <button class="reveal-btn" id="pRevealBtn">Reveal answer</button>
    <div id="pAnswer" class="hidden">
      <div class="monologue" style="margin-top:22px;">${q.a}</div>

      <div class="qconf-row" style="margin-top:26px;border-top:none;padding-top:0;" id="pConfRow">
        ${CONF_LEVELS.map(lvl => `<button class="conf-btn${entry.level === lvl ? ' active-' + lvl : ''}" data-lvl="${lvl}" id="pConf-${lvl}">${CONF_LABEL[lvl]}</button>`).join('')}
        <button class="mini-btn" id="pSkip">Skip / next random question</button>
      </div>
    </div>
    <div class="practice-stat-line">Seen ${entry.seen} time${entry.seen === 1 ? '' : 's'} so far${entry.level ? ` — currently marked "${CONF_LABEL[entry.level]}"` : ''}.</div>
  `;
  document.getElementById('pRevealBtn').addEventListener('click', () => {
    document.getElementById('pAnswer').classList.remove('hidden');

  });

}

function wireFilterRow(card) {

      <div class="q editfield" contenteditable="true" data-group="additionalQA" data-idx="${idx}" data-field="q" style="font-size:14px;">${qa.q}</div>
      <div class="a" style="display:block;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);">
        <div class="editfield" contenteditable="true" data-group="additionalQA" data-idx="${idx}" data-field="a">${qa.a}</div>
      </div>
      <div style="text-align:right;margin-top:8px;">
        <button class="conf-btn" style="padding:3px 10px;font-size:12px;" data-remove-group="additionalQA" data-remove-idx="${idx}">🗑 remove</button>
      </div>
    </div>`;
}

function editableGapHTML(gap, idx) {
  return `<div class="flag" style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
    <div class="editfield" contenteditable="true" data-group="gaps" data-idx="${idx}" style="flex:1;">${gap}</div>
    <button class="conf-btn" style="padding:2px 8px;font-size:11px;flex-shrink:0;" data-remove-group="gaps" data-remove-idx="${idx}">🗑</button>
  </div>`;
}

function renderEditCard(card, topic, c) {
  if (!c.coreQA) c.coreQA = [];
  if (!c.additionalQA) c.additionalQA = [];
  const coreHTML = c.coreQA.map((qa, i) => editableCoreQAHTML(qa, i)).join('');
  const addHTML = c.additionalQA.map((qa, i) => editableAdditionalQAHTML(qa, i)).join('');
  const gapsHTML = c.gaps.map((g, i) => editableGapHTML(g, i)).join('');

  card.innerHTML = `
    <div style="background:rgba(242,147,46,0.12);border:1px solid var(--accent);border-radius:6px;padding:8px 14px;font-size:12.5px;color:var(--gold);margin-bottom:20px;">
      ✏️ Edit mode — click any text to change it. Edits save automatically as you type; use "Download edited file" in the sidebar when you're done to get an updated copy of this page.
    </div>
    <h2 class="editfield" contenteditable="true" data-field="topicName">${topic.name}</h2>
    <div class="srcref editfield" contenteditable="true" data-field="topicRef">${topic.ref}</div>

    <div class="section">
      <h3>Core Questions <span class="section-sub">(medium-sized — feed the Practice/Anki pool)</span></h3>
      ${coreHTML}
      <button class="conf-btn" id="addCoreQA" style="margin-top:6px;">+ Add core question</button>
    </div>
    <div class="section">
      <h3>Additional / Quick-Fire Questions <span class="section-sub">(smaller supplementary facts)</span></h3>
      ${addHTML}
      <button class="conf-btn" id="addAdditionalQA" style="margin-top:6px;">+ Add additional question</button>
    </div>
    <div class="section">
      <h3>Gaps / Flags</h3>
      ${gapsHTML || '<div style="color:var(--ink-dim);font-size:14px;">No gaps flagged.</div>'}
      <button class="conf-btn" id="addGap" style="margin-top:10px;">+ Add gap / flag</button>
    </div>
  `;

  // topic name / ref
  card.querySelectorAll('.editfield[data-field]').forEach(el => {
    const field = el.getAttribute('data-field');
    if (field === 'topicName' || field === 'topicRef') {
      el.addEventListener('input', () => {
        if (field === 'topicName') {
          topic.name = el.innerText;
          if (activeItem) { const tn = activeItem.querySelector('.tname'); if (tn) tn.textContent = el.innerText; }
        } else {
          topic.ref = el.innerText;
        }
        persistOverrides(topic.id);
      });
    }
  });

  // Formatting toolbars — one per core-question answer field
  card.querySelectorAll('.fmt-toolbar').forEach(bar => {
    const targetId = bar.getAttribute('data-target');
    const targetEl = card.querySelector(`#${targetId}`);
    if (!targetEl) return;
    const syncField = () => {
      const idx = Number(targetEl.getAttribute('data-idx'));
      c.coreQA[idx].a = targetEl.innerHTML;
      persistOverrides(topic.id);
    };
    bar.querySelectorAll('.fmt-btn').forEach(btn => {
      btn.addEventListener('mousedown', (e) => e.preventDefault());
      btn.addEventListener('click', () => {
        targetEl.focus();
        document.execCommand(btn.getAttribute('data-cmd'), false, null);
        syncField();
      });
    });
    bar.querySelectorAll('.fmt-swatch').forEach(swatch => {
      swatch.addEventListener('mousedown', (e) => e.preventDefault());
      swatch.addEventListener('click', () => {
        targetEl.focus();
        document.execCommand('hiliteColor', false, swatch.getAttribute('data-color'));
        syncField();
      });
    });
  });

  // Q/A/src fields inside qcards and gap text fields
  card.querySelectorAll('.editfield[data-group]').forEach(el => {
    el.addEventListener('input', () => {
      const group = el.getAttribute('data-group');
      const idx = Number(el.getAttribute('data-idx'));
      const field = el.getAttribute('data-field');
      if (group === 'gaps') {
        c.gaps[idx] = el.innerText;
      } else if (field === 'q') {
        c[group][idx].q = el.innerText;
      } else if (field === 'a') {
        c[group][idx].a = el.innerHTML;
      } else if (field === 'src') {
        c[group][idx].src = el.innerText;
      }
      persistOverrides(topic.id);
    });
  });

  // Remove buttons
  card.querySelectorAll('[data-remove-group]').forEach(btn => {
    btn.addEventListener('click', () => {
      const group = btn.getAttribute('data-remove-group');
      const idx = Number(btn.getAttribute('data-remove-idx'));
      c[group].splice(idx, 1);
      persistOverrides(topic.id);
      renderEditCard(card, topic, c);
    });
  });

  document.getElementById('addCoreQA').addEventListener('click', () => {
    c.coreQA.push({ q: 'New question', a: 'New answer' });
    persistOverrides(topic.id);
    renderEditCard(card, topic, c);
  });
  document.getElementById('addAdditionalQA').addEventListener('click', () => {
    c.additionalQA.push({ q: 'New question', a: 'New answer' });
    persistOverrides(topic.id);
    renderEditCard(card, topic, c);
  });
  document.getElementById('addGap').addEventListener('click', () => {
    c.gaps.push('New gap / flag — describe what is uncertain or unsourced here.');
    persistOverrides(topic.id);
    renderEditCard(card, topic, c);
  });
}

// ---------- QR-LINK AUTO-IMPORT (triggered by scanning a sync QR code) ----------
(function checkHashSync() {
  if (!location.hash || location.hash.indexOf('#sync=') !== 0) return;
  const packed = location.hash.slice(6);
  const cleanUrl = location.href.split('#')[0];
  try { history.replaceState(null, '', cleanUrl); } catch (e) {}
  decompressText(packed).then(text => {
    let data;
    try { data = JSON.parse(text); } catch (e) { return; }
    if (!data || (!data.confidence && !data.qConfidence && !data.contentOverrides)) return;
    if (confirm('Import synced progress from this scanned code?\n\nThis merges with what\'s already on this device.')) {
      if (applyImportedBundle(data)) { alert('Synced!'); location.reload(); }
    }
  }).catch(() => { /* malformed or unreadable link — ignore silently */ });
})();

if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script></body></html>
